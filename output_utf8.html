<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="cache-control" content="max-age=0">
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 11:00:00 GMT">
    <meta http-equiv="pragma" content="no-cache">
    <link rel="shortcut icon" href="assets/img/logo_1TA_ico-32x32.png">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="assets/css/t1.css?version=1.0.1">
    <link rel="stylesheet" type="text/css" href="assets/css/consulta-causa.css">
    <!-- JQuery -->
    <script src="assets/lib/jquery/jquery-3.6.1.min.js"></script>
    <!-- DateTable Estilos -->
    <link rel="stylesheet" type="text/css"
          href="assets/lib/datatables/datatables.net-bs4/css/dataTables.bootstrap4.min.css"/>
    <!-- DateTimePiker -->
    <link rel="stylesheet" type="text/css" href="assets/lib/datetimepicker/css/bootstrap-datetimepicker.min.css"/>
    <!-- Customs JQ actions -->
    <script src="assets/custom-actions.js"></script>
    <!-- Alerts -->
    <script src="assets/lib/sweetalert2/sweetalert2.all.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.0.2/sha.js"></script>
    <script src="assets/lib/js.cookie/js.cookie.js"></script>
    <script src="consulta-causa.js"></script>
    <!-- Data Table -->
    <script src="assets/lib/datatables/datatables.net/js/jquery.dataTables.js" type="text/javascript"></script>
    <script src="assets/lib/datatables/datatables.net-bs4/js/dataTables.bootstrap4.js" type="text/javascript"></script>
    <!-- Data Table -->
    <!-- DateTimePiker -->
    <script src="assets/lib/datetimepicker/js/bootstrap-datetimepicker.min.js" type="text/javascript"></script>
    <script src="assets/lib/datetimepicker/js/locales/bootstrap-datetimepicker.es.js" type="text/javascript"></script>
    <!-- DateTimePiker -->
    <script src="assets/lib/moment.js/moment.js" type="text/javascript"></script>

    <!-- DatePiker -->
    <link rel="stylesheet" type="text/css" href="assets/lib/datepicker/css/bootstrap-datepicker.min.css"/>
    <script src="assets/lib/datepicker/js/bootstrap-datepicker.min.js" type="text/javascript"></script>
    <script src="assets/lib/datepicker/locales/bootstrap-datepicker.es.min.js" type="text/javascript"></script>

    <script src="assets/lib/sweetalert2/sweetalert2.all.js" type="text/javascript"></script>
    <!-- Menú Dinamico -->
    <script src="common/menu.js" type="text/javascript"></script>
    <!-- Funciones del Header -->
    <script src="common/header.js" type="text/javascript"></script>
    <!-- Parametros de configuracion -->
    <script src="common/configuracion.js" type="text/javascript"></script>
    <!-- Login -->
    <script src="common/login.js"></script>
    <!-- SHA -->
    <script src="assets/lib/jssha/sha.js"></script>
    <!-- Titulo pagina -->
    <title>Primer Tribunal Ambiental</title>
</head>

<body>
<input type="hidden" id="p_idUsuario">
<!-- Se completa en header.js -->
<input type="hidden" id="p_rolUsuario">
<!-- Se completa en header.js -->
<header></header>
<div class="contenedor-principal">
    <div class="msj info">
        <div class="icon"></div>
        <div class="text">
            <h6>Aviso importante</h6>
            <!--p>Actualmente nos encontramos en marcha blanca del nuevo Sistema de Gestión de Causas del Primer Tribunal
                Ambiental, en caso que usted tenga alguna complicación con el mismo puede remitir sus escritos a <b>contacto@1ta.cl</b>
                o bien llamar al fono <b>552467300</b></p-->
            <!--a href="" class="see">Ver más</a-->
        </div>
    </div>
    <div class="encabezado">
        <h1>Consulta de causas</h1>
        <button class="btn btn-primary" id="btn-buscador-avanzado">Buscador Avanzado</button>
        <button class="btn btn-primary buscador-simple" style="display: none">Buscador simple</button>
    </div>
    <div class="buscador">
        <div class="filtros">
            <div class="question">
                <select name="tipoCausaSimple" id="tipoCausaSimple" class="tipoCausa">
                    <option value="null">--Seleccione--</option>
                </select>
                <label>Tipo de Causa</label>
            </div>
            <div class="question number">
                <input name="numRol" id="numRol" type="text"/>
                <label>Número de Rol</label>
            </div>
            <div class="question date">
                <div class="question date">
                    <select name="anioIngreso" id="anioIngreso" class="inputAnio"></select>
                    <label>Año de ingreso</label>
                </div>
            </div>
            <div class="question">
                <select name="estadoSimple" id="estadoSimple" class="estado">
                    <option value="null">--Seleccione--</option>
                </select>
                <label>Estado</label>
            </div>

        </div>
        <div class="botonera">
            <a href="" class="btn btn-secondary btn-limpiar">Limpiar campos</a>
            <a id="btnBuscar" class="btn btn-primary btn-buscar">buscar</a>
        </div>
    </div>
    <div class="buscador-avanzado" style="display: none">
        <div class="js-tabs">
            <ul id="tabs-nav">
                <li id="xfecha"><a href="#tab1">Búsqueda por fecha</a></li>
                <li id="xnombre"><a href="#tab2">Búsqueda por nombre</a></li>
                <li id="xsocioambiental"><a href="#tab3">Búsqueda por interviniente</a></li>
                <li id="xactividadeconomica"><a href="#tab4">Búsqueda por actividad económica</a></li>
            </ul>
            <!-- END tabs-nav -->
            <div id="tabs-content">
                <div id="tab1" class="tab-content">
                    <div class="filtros">
                        <div class="question">
                            <select name="tipoCausaFecha" id="tipoCausaFecha" class="tipoCausa">
                                <option value="null">--Seleccione--</option>
                            </select>
                            <label>Tipo de Causa</label>
                        </div>
                        <div class="question date">
                            <input class="inputCalendar" name="fechaInicio" id="fechaInicio" type="text"
                                   data-min-view="1" data-date-format="dd-mm-yyyy" autocomplete="off">
                            <label>Fecha de inicio</label>
                        </div>

                        <div class="question date">
                            <input class="inputCalendar" name="fechaTermino" id="fechaTermino" type="text"
                                   data-min-view="1" data-date-format="dd-mm-yyyy" autocomplete="off">
                            <label>Fecha de termino</label>
                        </div>
                        <div class="botonera">
                            <button class="btn btn-secondary btn-limpiar">Limpiar</button>
                            <button class="btn btn-primary btn-buscar" id="buscFecha">Buscar</button>
                        </div>
                    </div>
                </div>
                <div id="tab2" class="tab-content">
                    <div class="filtros">
                        <div>
                            <input type="radio" id="tipo-natural" name="p-add-tipo" value="N" checked>
                            <label for="tipo-natural">Natural</label>
                        </div>
                        <div>
                            <input type="radio" id="tipo-juridica" name="p-add-tipo" value="J">
                            <label for="tipo-juridica">Jurídica</label>
                        </div>
                    </div>
                    <div class="filtros persona-natural">
                        <div class="question">
                            <input class="inputNombre" name="inputNombre" id="inputNombre" type="text"
                                   autocomplete="off">
                            <label>Nombre</label>
                        </div>
                        <div class="question">
                            <input class="inputAPaterno" name="inputAPaterno" id="inputAPaterno" type="text"
                                   autocomplete="off">
                            <label>Apellido Paterno</label>
                        </div>
                        <div class="question">
                            <div class="question">
                                <select name="anio" class="inputAnio" id="anioIngresoNombres"></select>
                                <label>Año</label>
                            </div>
                        </div>
                        <div class="botonera">
                            <button class="btn btn-secondary btn-limpiar">Limpiar</button>
                            <button class="btn btn-primary btn-buscar" id="buscNombreN">Buscar</button>
                        </div>
                    </div>
                    <div class="filtros persona-juridico" style="display: none">
                        <div class="question">
                            <input class="inputNombreJuridico" name="inputNombreJuridico" id="nombreJuridico"
                                   type="text" autocomplete="off" size="80">
                            <label>Nombre de persona jurídica</label>
                        </div>
                        <div class="botonera">
                            <button class="btn btn-secondary btn-limpiar">Limpiar</button>
                            <button class="btn btn-primary btn-buscar" id="buscNombreJ">Buscar</button>
                        </div>
                    </div>

                </div>
                <div id="tab3" class="tab-content">
                    <div class="filtros">
                        <div class="question">
                            <select name="tipoCausaSocioAmbiental" id="tipoCausaSocioAmbiental" class="tipoCausa">
                                <option value="null">--Seleccione--</option>
                            </select>
                            <label>Tipo de Causa</label>
                        </div>
                        <div class="question">
                            <select name="region" id="region">
                                <option value="null">--Seleccione--</option>
                            </select>
                            <label>Región</label>
                        </div>
                        <div class="question">
                            <select name="intervinente" id="intervinente">
                                <option value="null">--Seleccione--</option>
                            </select>
                            <label>Intervinente</label>
                        </div>
                        <div class="question">
                            <div class="question">
                                <select name="anio" class="inputAnio" id="anioSocioAmbiental"></select>
                                <label>Año</label>
                            </div>
                        </div>
                        <div class="botonera">
                            <button class="btn btn-secondary btn-limpiar">Limpiar</button>
                            <button class="btn btn-primary btn-buscar" id="buscActSocioAmbiental">Buscar</button>
                        </div>
                    </div>
                </div>
                <div id="tab4" class="tab-content">
                    <div class="filtros">
                        <div class="question">
                            <select name="tipoCausaActEconomica" id="tipoCausaActEconomica" class="tipoCausa">
                                <option value="null">--Seleccione--</option>
                            </select>
                            <label>Tipo de Causa</label>
                        </div>
                        <div class="question">
                            <select name="actividad" id="actividad">
                                <option value="null">--Seleccione--</option>
                            </select>
                            <label>Actividad</label>
                        </div>
                        <div class="question">
                            <div class="question">
                                <select name="anio" class="inputAnio" id="anioActividad"></select>
                                <label>Año</label>
                            </div>
                        </div>
                        <div class="botonera">
                            <button class="btn btn-secondary btn-limpiar">Limpiar</button>
                            <button class="btn btn-primary btn-buscar" id="buscActEconomica">Buscar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="section-separator"></div>
    <div id="div-resultados" hidden>
        <h1>Resultados de la búsqueda</h1>
        <div class="box">
            <div id="div-tabla" class="table-responsive noSwipe be-content be-loading">
                <table id="tabla-consulta-causa" class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th style="width:10%;">Tipo de Causa</th>
                        <th style="width:10%;">ROL</th>
                        <th style="width:10%;">Fecha ingreso</th>
                        <th style="width:45%;">Carátula</th>
                        <th style="width:10%;">Estado Subtipo</th>
                        <th style="width:10%;">Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>

                </table>
                <div class="be-spinner">
                    <svg width="40px" height="40px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
                        <circle fill="none" stroke-width="4" stroke-linecap="round" cx="33" cy="33" r="30"
                                class="circle"></circle>
                    </svg>
                </div>
            </div>

        </div>
    </div>
</div>
<section class="footer"></section>
</body>

</html>
